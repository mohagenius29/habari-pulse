name: Update feed
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - run: |
          git config user.name "habari-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
