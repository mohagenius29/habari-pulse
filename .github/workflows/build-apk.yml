name: Build APK
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: cp data/feed.json app/src/main/assets/data/feed.json
      - run: gradle assembleDebug -PfeedUrl=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data/feed.json
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HabariPulse.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest -t "Habari Pulse APK" -n "Latest build. Download HabariPulse.apk and install it."
          gh release upload apk-latest HabariPulse.apk --clobber
